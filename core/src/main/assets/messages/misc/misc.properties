efpd.openworld.mode_title=Choose a mode
efpd.openworld.mode_desc=_Extraction:_ dive in, grab loot and get out alive. Each run is separate, only your stash carries over.\n\n_Open world survival:_ a persistent world with a base town and regions. Dying drops your gear where you fell; you wake up in town.\n\n_Urban warfare:_ a wide ruined city. Start in the middle, loot buildings floor by floor and escape through a gate in the city wall. Extraction rules apply.\n\n_Bounty hunt:_ hunt a powerful target hiding in every district of the ruined city. You only get a rough hint of where it is, and killing it turns the whole district against you.
