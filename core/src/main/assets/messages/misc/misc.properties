###boss trophies and unique weapons
efpd.uniques.bosstrophy$tengufeather.name=Tengu's feather
efpd.uniques.bosstrophy$tengufeather.desc=A blood-red feather torn from Tengu's mask. Two of them brewed at an alchemy pot make the Tengu's Talon.
efpd.uniques.bosstrophy$royalseal.name=royal seal
efpd.uniques.bosstrophy$royalseal.desc=A heavy golden seal of the dwarven kings. Two of them brewed at an alchemy pot make the Royal Glaive.
efpd.uniques.uniqueweapon$oozeblade.name=ooze blade
efpd.uniques.uniqueweapon$oozeblade.desc=A dagger forged from the Goo's hardened slime. It still drips. Brewed from two Goo blobs.
efpd.uniques.uniqueweapon$oozeblade.effect=_Unique:_ hits have a 33% chance to coat the enemy in caustic ooze, which burns them over time.
efpd.uniques.uniqueweapon$tengutalon.name=Tengu's talon
efpd.uniques.uniqueweapon$tengutalon.desc=A curved blade bound with Tengu's feathers. It strikes fast, like its former owner. Brewed from two of Tengu's feathers.
efpd.uniques.uniqueweapon$tengutalon.effect=_Unique:_ attacks 50% faster, and hits have a 15% chance to blind the enemy for 3 turns.
efpd.uniques.uniqueweapon$pistonhammer.name=piston hammer
efpd.uniques.uniqueweapon$pistonhammer.desc=A hammer built around one of DM-300's pistons. Every swing hisses. Brewed from two metal shards.
efpd.uniques.uniqueweapon$pistonhammer.effect=_Unique:_ hits have a 20% chance to stun a non-boss enemy for 2 turns.
efpd.uniques.uniqueweapon$royalglaive.name=royal glaive
efpd.uniques.uniqueweapon$royalglaive.desc=The Dwarf King's ceremonial glaive, still humming with his necromancy. Brewed from two royal seals.
efpd.uniques.uniqueweapon$royalglaive.effect=_Unique:_ reaches two tiles, and every hit heals you for 15% of the damage dealt.
efpd.wnddevtools.cat_uniques=Boss trophies and unique weapons

###urban warfare mode
efpd.urban.urban.mode_urban=Urban warfare
efpd.urban.urban.start=You stand in the middle of a ruined city. Find a gate in the city wall to escape. Buildings hold loot, and their stairs lead to upper floors and basements. You can still take things from the stash here.
efpd.urban.urban.new_zone=You climb out of the subway into district %d. The streets here are more dangerous, and so is the loot.
efpd.urban.urbanescape.title=City gate
efpd.urban.urbanescape.desc=Beyond this gate lies safety. Escaping ends the run: everything you carry goes into the stash.
efpd.urban.urbanescape.escape=Escape the city
efpd.urban.urbanescape.stay=Stay
efpd.urban.looter.name=looter
efpd.urban.looter.desc=A scavenger who picks the city clean, and anyone who wanders into it. Quick on their feet, armed with a crowbar.
efpd.urban.gunman.name=gunman
efpd.urban.gunman.desc=A desperate survivor with a pistol. They shoot from a distance whenever they have a clear line of fire.

###open world <-> ruined city
efpd.wndworldmap.city=Ruined city
efpd.wndworldmap.city_title=Ruined city
efpd.wndworldmap.city_desc=A war-torn city beyond the hills. Its buildings hold rare loot: high-tier tonics, essences, guns, rings, wands and artifacts. A district opens when you open the dungeon region of the same rank. The city gates lead back to town, and a district regrows 3 days after you leave it.
efpd.wndworldmap.city_district=Ruined city, district %d
efpd.urban.urban.ow_arrive=You arrive in district %d of the ruined city. Search the buildings for rare loot; the gates in the city wall lead back to town.
efpd.urban.urbanescape.desc_town=This gate leads out of the city, back to your base town.
efpd.urban.urbanescape.go_town=Return to town
