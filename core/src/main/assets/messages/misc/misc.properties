efpd.hvt.hvt.brief_title=BOUNTY
efpd.hvt.hvt.brief=_District %1$d target: %2$s_\n\nIn %4$s %3$s, %5$s\n\nKill the target and its escorts and take its dog tag. The moment it falls, the whole district is alerted: every enemy closes in and reinforcements guard the gates.
efpd.hvt.hvt.brief_done=The target of district %d is dead. The streets are still out for your blood.
efpd.hvt.hvt.site_0_0=the armory
efpd.hvt.hvt.site_0_1=the police station
efpd.hvt.hvt.site_0_2=the army checkpoint
efpd.hvt.hvt.site_1_0=the cathedral
efpd.hvt.hvt.site_1_1=the old library
efpd.hvt.hvt.site_1_2=the research lab
efpd.hvt.hvt.site_2_0=the meat plant
efpd.hvt.hvt.site_2_1=the hospital
efpd.hvt.hvt.site_2_2=the warehouse
efpd.hvt.hvt.sign_0=gunfire echoes.
efpd.hvt.hvt.sign_1=waves of dark magic pulse.
efpd.hvt.hvt.sign_2=screams ring out.
efpd.hvt.hvt.alarm=The target is down! Alarms wail across the district. Every enemy is coming for you, and fresh troops are guarding the gates!
efpd.hvt.hvt$manhunt.name=Manhunt
efpd.hvt.hvt$manhunt.desc=You killed this district's target. Every enemy here keeps closing in on your position until you leave the district.
efpd.hvt.hvtboss.name=high value target
efpd.hvt.hvtboss.name_0=Warlord Kael
efpd.hvt.hvtboss.name_1=Hexer Morrow
efpd.hvt.hvtboss.name_2=Butcher Grint
efpd.hvt.hvtboss.desc_0=The warlord who runs the looter gangs. Fires from cover and lobs grenades at anything that moves.
efpd.hvt.hvtboss.desc_1=A renegade dwarf warlock who rules the ruins with dark magic. Casts shadow bolts and calls down mana bursts.
efpd.hvt.hvtboss.desc_2=A hulking gnoll who carves up whoever crosses him. Charges into melee, throws firebombs, and gets faster when hurt.
efpd.hvt.hvtboss.tactics=It fights with tactics: it calls its escorts, ducks out of your line of fire, throws attacks that land after a short fuse (watch the marked tiles), and when badly hurt it vanishes in smoke to patch itself up.
efpd.hvt.hvtboss.spot_0=Contact! Light them up!
efpd.hvt.hvtboss.spot_1=An intruder... how delightful.
efpd.hvt.hvtboss.spot_2=FRESH MEAT!
efpd.hvt.hvtboss.throw_0=Grenade!
efpd.hvt.hvtboss.throw_1=Mana burst!
efpd.hvt.hvtboss.throw_2=Firebomb!
efpd.hvt.hvtboss.retreat_0=Smoke out! Fall back!
efpd.hvt.hvtboss.retreat_1=Not today...
efpd.hvt.hvtboss.retreat_2=Grr... later!
efpd.hvt.hvtboss.die_0=You... won't get out of here...
efpd.hvt.hvtboss.die_1=My power... the whole city... will hunt you...
efpd.hvt.hvtboss.die_2=Boys... get... them...
efpd.hvt.hvtboss.recover=%s patched up their wounds!
efpd.hvt.hvtboss.vault_hint=It carried a vault key. The district vault is %s of here.
efpd.hvt.hvtblast.warn_0=A grenade lands nearby. Get out of the marked area!
efpd.hvt.hvtblast.warn_1=Dark mana gathers on the ground. Get out of the marked area!
efpd.hvt.hvtblast.warn_2=A firebomb shatters nearby. Get out of the marked area!
efpd.hvt.hvtblast.killed=You were caught in the mana burst...
efpd.hvt.dogtag.name=dog tag of %s
efpd.hvt.dogtag.desc=Proof that you killed %s, the target of district %d. Sell it for a bounty of %d gold.
efpd.hvt.vaultkey.name=vault key
efpd.hvt.vaultkey.desc=A heavy key taken from the target of district %d. It opens the locked door of that district's secret vault.
efpd.hvt.vaultkey.opened=The vault door swings open.
efpd.hvt.hvtgear$commanderscarbine.name=commander's carbine
efpd.hvt.hvtgear$commanderscarbine.desc=The warlord's personal rifle, kept in perfect order.
efpd.hvt.hvtgear$commanderscarbine.effect=A large magazine, a fast trigger, accuracy that improves with range, and a quieter report than other rifles.
efpd.hvt.hvtgear$hexstaff.name=hex staff
efpd.hvt.hvtgear$hexstaff.desc=The renegade warlock's staff, still humming with dark power.
efpd.hvt.hvtgear$hexstaff.effect=Hits can hex the target, leaving it weakened and vulnerable for a few turns.
efpd.hvt.hvtgear$butchercleaver.name=butcher's cleaver
efpd.hvt.hvtgear$butchercleaver.desc=A huge, notched cleaver that has seen far too much use.
efpd.hvt.hvtgear$butchercleaver.effect=Hits can open a deep wound that keeps bleeding.
efpd.lab.lab.mode_lab=The Lab (final)
efpd.lab.lab.status=_The Lab:_ the final destination. Entry costs a keycard from the stash. Keycards in stash: %1$d. Lab escapes: %2$d.
efpd.lab.lab.no_keycard=You need a _Lab keycard_ in your stash to enter the Lab.\n\nKeycards are rare finds in the other extraction modes: DM-300 (20%), the Dwarf King (40%), Yog-Dzewa (always), bounty hunt targets (10% per district), city vaults (35%) and top floor chests from district 3 on. Extract with one to keep it.
efpd.lab.lab.brief_title=THE LAB
efpd.lab.lab.brief=Your keycard opens the sealed research complex. Only elite mercenaries and security golems guard it, the vents leak toxic gas and the air leaves you starving twice as fast.\n\nThe escape elevator has no power. Start all %d generators, then pull the emergency lever next to the elevator. The lever sets off the alarm and calls in elite reinforcements: fight your way into the elevator to escape for good.\n\nYou can still take things out of the stash here, until you touch a generator or leave this room.
efpd.lab.lab.arrive=Generators running: %1$d/%2$d.
efpd.lab.lab.gas=Toxic gas hisses out of a vent!
efpd.lab.lab.no_power=The elevator has no power. Start the generators (%1$d/%2$d running) and pull the emergency lever.
efpd.lab.lab.gen_running=This generator is already running.
efpd.lab.lab.gen_on=The generator roars to life! (%1$d/%2$d) The noise is drawing attention...
efpd.lab.lab.all_power=All generators are running. Pull the emergency lever next to the elevator.
efpd.lab.lab.lever_no_power=The lever won't budge without power. (%1$d/%2$d generators running)
efpd.lab.lab.lever_done=The lever is already pulled. Get to the elevator!
efpd.lab.lab.lever_pulled=ALARM! Lockdown sirens wail as the elevator powers up. Elite reinforcements are pouring in. Get to the elevator!
efpd.lab.lab.escape_title=Escape elevator
efpd.lab.lab.escape_desc=The elevator hums, ready to take you out of the Lab for good.
efpd.lab.lab.escape=Escape the Lab
efpd.lab.lab.stay=Stay
efpd.lab.lab.victory_title=FINAL DESTINATION
efpd.lab.lab.victory=The elevator doors close on the sirens. You made it out of the Lab with everything you could carry.\n\nThis is the end of the road that started in the sewers: you have escaped from Pixel Dungeon.\n\nLab escapes: %d
efpd.lab.lab.tile_gen_off=Generator (off)
efpd.lab.lab.tile_gen_on=Generator (running)
efpd.lab.lab.tile_lever=Emergency lever
efpd.lab.lab.tile_elevator=Escape elevator
efpd.lab.lab.tile_machine=Lab machinery
efpd.lab.lab.tile_gen_off_desc=A backup generator. Step onto it to start it. It will be loud.
efpd.lab.lab.tile_gen_on_desc=A running generator, feeding power to the escape elevator.
efpd.lab.lab.tile_lever_desc=The emergency lever that powers the escape elevator. It needs every generator running, and pulling it sets off the alarm.
efpd.lab.lab.tile_lever_done_desc=The lever is pulled. The elevator is powered.
efpd.lab.lab.tile_vent=Gas vent
efpd.lab.lab.tile_vent_desc=A floor vent. Every now and then it leaks toxic gas.
efpd.lab.lab.tile_elevator_desc=The way out. It has no power yet.
efpd.lab.lab.tile_elevator_on_desc=The way out, powered and waiting. Step in to escape.
efpd.lab.lab.tile_machine_desc=Humming lab equipment, too heavy to move.
efpd.lab.lab$hazard.name=Lab air
efpd.lab.lab$hazard.desc=The Lab's vents leak toxic gas now and then, and you get hungry twice as fast in here.
efpd.lab.lab$lockdown.name=Lockdown
efpd.lab.lab$lockdown.desc=The alarm is on. Every guard in the Lab keeps closing in on you until you escape.
efpd.lab.labmercenary.name=elite mercenary
efpd.lab.labmercenary.desc=A mercenary in heavy body armour, hired to keep the Lab sealed. Shoots from a distance with a clear line of fire.
efpd.lab.labgolem.name=security golem
efpd.lab.labgolem.desc=A golem rebuilt as a Lab guard. Slow to anger, hard to stop.
efpd.lab.keycard.name=Lab keycard
efpd.lab.keycard.desc=An access card for the sealed Lab. Keep it in the stash: starting a Lab run uses one.
efpd.lab.keycard.found=You found a Lab keycard! Extract with it to keep it.
efpd.ringsage.name=ring sage
efpd.ringsage.desc=An ancient sage who came up from the depths once Yog-Dzewa fell. They can bind a ring's power to you for good.
efpd.ringsage.unlocked=With Yog-Dzewa gone, an ancient ring sage has come up from the depths. They are waiting for you in the base town.
efpd.ringsage.talk=Give me a ring and I will bind its power to your soul. The ring is lost, but its effect stays with you forever, on top of the rings you wear. One ring of each kind; a stronger ring can replace a weaker one.
efpd.ringsage.none_bound=No rings bound yet.
efpd.ringsage.bound_title=_Bound rings:_
efpd.ringsage.offer=Offer a ring
efpd.ringsage.bye=Leave
efpd.ringsage.prompt=Offer which ring?
efpd.ringsage.refuse_cursed=A cursed ring would poison your soul. I won't bind it.
efpd.ringsage.refuse_weaker=Your soul already holds %s, which is as strong or stronger.
efpd.ringsage.confirm=Bind %s to your soul? The ring will be gone, and its effect will last forever.
efpd.ringsage.confirm_replace=Bind %1$s to your soul? It replaces %2$s, which will be lost.
efpd.ringsage.yes=Bind it
efpd.ringsage.no=Not now
efpd.ringsage.bound=The power of %s now flows through you for good.
