efpd.hemorrhage.name_light=출혈
efpd.hemorrhage.name_heavy=과다 출혈
efpd.hemorrhage.desc=상처에서 피가 흐르고 있습니다. 저절로 멈추지 않으니 붕대, 응급처치 키트, 치유 물약으로 치료하세요.
efpd.hemorrhage.desc_light=체력이 천천히 줄어들어, 자연 회복을 거의 상쇄합니다.
efpd.hemorrhage.desc_heavy=체력이 빠르게 줄어듭니다. 서둘러 치료하세요!
