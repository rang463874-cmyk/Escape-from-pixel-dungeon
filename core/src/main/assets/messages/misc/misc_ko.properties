###보스 전리품과 고유 무기
efpd.uniques.bosstrophy$tengufeather.name=텐구의 깃털
efpd.uniques.bosstrophy$tengufeather.desc=텐구의 가면에서 뜯어낸 핏빛 깃털입니다. 연금술 솥에서 2개를 섞으면 텐구의 발톱이 됩니다.
efpd.uniques.bosstrophy$royalseal.name=왕의 인장
efpd.uniques.bosstrophy$royalseal.desc=드워프 왕가의 묵직한 금 인장입니다. 연금술 솥에서 2개를 섞으면 왕의 글레이브가 됩니다.
efpd.uniques.uniqueweapon$oozeblade.name=점액 칼날
efpd.uniques.uniqueweapon$oozeblade.desc=구의 굳은 점액으로 벼린 단검입니다. 아직도 점액이 뚝뚝 떨어집니다. 구의 점액 2개로 만듭니다.
efpd.uniques.uniqueweapon$oozeblade.effect=_고유 효과:_ 적중 시 33% 확률로 적에게 산성 점액을 묻혀 지속 피해를 줍니다.
efpd.uniques.uniqueweapon$tengutalon.name=텐구의 발톱
efpd.uniques.uniqueweapon$tengutalon.desc=텐구의 깃털을 감은 굽은 칼날입니다. 옛 주인처럼 빠르게 벱니다. 텐구의 깃털 2개로 만듭니다.
efpd.uniques.uniqueweapon$tengutalon.effect=_고유 효과:_ 공격 속도가 50% 빠르고, 적중 시 15% 확률로 적을 3턴 동안 실명시킵니다.
efpd.uniques.uniqueweapon$pistonhammer.name=피스톤 망치
efpd.uniques.uniqueweapon$pistonhammer.desc=DM-300의 피스톤을 박아 넣은 망치입니다. 휘두를 때마다 증기가 새어 나옵니다. 금속 파편 2개로 만듭니다.
efpd.uniques.uniqueweapon$pistonhammer.effect=_고유 효과:_ 적중 시 20% 확률로 보스가 아닌 적을 2턴 동안 기절시킵니다.
efpd.uniques.uniqueweapon$royalglaive.name=왕의 글레이브
efpd.uniques.uniqueweapon$royalglaive.desc=드워프 왕의 의식용 글레이브로, 아직 그의 강령술이 웅웅거립니다. 왕의 인장 2개로 만듭니다.
efpd.uniques.uniqueweapon$royalglaive.effect=_고유 효과:_ 2칸 떨어진 적까지 닿고, 적중할 때마다 준 피해의 15%만큼 체력을 회복합니다.
efpd.wnddevtools.cat_uniques=보스 전리품과 고유 무기

###시가전 모드
efpd.urban.urban.mode_urban=시가전
efpd.urban.urban.start=폐허가 된 도시 한가운데입니다. 성벽의 문을 찾아 탈출하세요. 건물 안에 전리품이 있고, 건물 안의 계단으로 위층과 지하로 갈 수 있습니다. 여기서는 아직 창고의 물건을 꺼낼 수 있습니다.
efpd.urban.urban.new_zone=지하철 계단을 올라 %d구역에 도착했습니다. 이곳의 거리는 더 위험하지만, 전리품도 더 좋습니다.
efpd.urban.urbanescape.title=도시 성문
efpd.urban.urbanescape.desc=이 문을 나서면 안전합니다. 탈출하면 이번 판이 끝나고, 가진 물건은 모두 창고로 옮겨집니다.
efpd.urban.urbanescape.escape=도시를 탈출한다
efpd.urban.urbanescape.stay=머무른다
efpd.urban.looter.name=약탈자
efpd.urban.looter.desc=도시를 샅샅이 뒤지는 약탈자입니다. 길을 잘못 든 사람도 가만두지 않습니다. 발이 빠르고 쇠지렛대를 휘두릅니다.
efpd.urban.gunman.name=총잡이
efpd.urban.gunman.desc=권총을 든 절박한 생존자입니다. 사선이 트이면 멀리서도 총을 쏩니다.

