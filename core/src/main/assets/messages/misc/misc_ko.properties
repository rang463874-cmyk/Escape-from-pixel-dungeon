efpd.thirst.thirsty=목마름
efpd.thirst.dehydrated=탈수
efpd.thirst.desc_thirsty=목이 마릅니다. 곧 물을 마셔야 합니다.\n\n수통은 마을 우물이나 샘, 또는 던전의 물에서 채울 수 있습니다. 던전의 물은 생수라서 배탈이 날 수 있습니다.
efpd.thirst.desc_dehydrated=탈수 상태입니다! 체력이 조금씩 줄고 적의 공격에 맞기 쉬워집니다.\n\n최대한 빨리 물을 마시세요.
