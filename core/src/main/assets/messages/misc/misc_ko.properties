efpd.encumbrance.name_2=과적
efpd.encumbrance.name_3=극심한 과적
efpd.encumbrance.desc=감당할 수 있는 것보다 많은 짐을 들고 있습니다.\n\n소지 무게: %1$s / %2$s\n이동 속도: -%3$d%%\n회피: -%4$d%%\n\n아이템을 버리거나 사용하고, 힘을 키우면 짐이 가벼워집니다.
efpd.encumbrance.heavier_1=짐이 무거워졌습니다. 몸이 둔해집니다.
efpd.encumbrance.heavier_2=과적 상태입니다! 제대로 움직이기 힘듭니다.
