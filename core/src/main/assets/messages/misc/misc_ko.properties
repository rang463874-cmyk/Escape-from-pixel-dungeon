efpd.facilities.name_forge=대장간
efpd.facilities.desc_bed=다음 날 아침까지 잡니다. 자고 나면 체력이 회복되지만(단계별 최대 체력의 50% / 75% / 100%) 배고픔과 목마름이 늘어납니다. 3단계에서는 출혈도 멈춥니다.
efpd.facilities.desc_kitchen=수통의 생수를 끓이고 날고기를 굽습니다. 2단계는 작은 식량 2개로 식량 1개를, 3단계는 고기 3개와 식량 1개로 고기 파이를 만듭니다.
efpd.facilities.desc_infirmary=골드를 내고 모든 부상과 출혈을 치료합니다. 단계가 오를수록 싸집니다(100% / 75% / 50%).
efpd.facilities.desc_farm=씨앗을 심고 얼마 뒤 수확합니다. 씨앗은 2–3개로 불어나고, 블랜드프루트 씨앗은 블랜드프루트 2개가 됩니다. 단계마다 밭이 늘어납니다(2 / 4 / 6칸).
efpd.facilities.desc_forge=1단계는 저주 해제, 2단계는 감정, 3단계는 골드와 정제 금속으로 장비를 1단계 강화합니다(최대 +3).
