efpd.urban.urban.ow_arrive=폐허 도시 %d구역에 도착했습니다. 건물에서 희귀한 전리품을 찾으세요. 성벽의 문으로 마을에 돌아갈 수 있습니다.
efpd.urban.urbanescape.desc_town=이 문을 나서면 도시를 떠나 거점 마을로 돌아갑니다.
efpd.urban.urbanescape.go_town=마을로 돌아가기
