efpd.items.bandage.name=붕대
efpd.items.bandage.desc=깨끗한 천 뭉치입니다. 상처에 감으면 출혈이 멈추지만, 부상은 치료하지 못합니다.
efpd.items.bandage.no_need=출혈이 없습니다.
efpd.items.splint.name=부목
efpd.items.splint.desc=튼튼한 막대 두 개와 천입니다. 가장 심하게 다친 팔다리(팔, 하체, 발) 한 곳을 완전히 치료합니다.
efpd.items.splint.no_need=다친 팔다리가 없습니다.
efpd.items.firstaidkit.name=응급처치 키트
efpd.items.firstaidkit.desc=제대로 된 의료품 상자입니다. 머리와 상체를 포함한 모든 부상을 치료하고 출혈을 멈춥니다. 사용하는 데 시간이 걸립니다.
efpd.items.firstaidkit.no_need=부상이나 출혈이 없습니다.

