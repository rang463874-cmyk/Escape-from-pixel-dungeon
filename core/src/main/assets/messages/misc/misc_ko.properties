###Escape from Pixel Dungeon (EFPD) mod
efpd.stash.hint=은신처 창고에 물자가 있습니다. 내려가기 전에 입구 계단을 밟아 창고를 여세요.

efpd.extraction.entrance_title=던전 입구
efpd.extraction.entrance_desc=이곳이 탈출구입니다. 살아서 탈출하면 전리품과 골드가 은신처 창고로 옮겨집니다. 시작 장비와 가방은 두고 갑니다.\n\n던전에서 죽으면 가지고 들어간 모든 것을 잃습니다.
efpd.extraction.entrance_locked=창고는 처음 내려가기 전에만 꺼낼 수 있습니다. 내용물은 확인할 수 있습니다.
efpd.extraction.extract=탈출하기
efpd.extraction.open_stash=창고 열기
efpd.extraction.cancel=취소
efpd.extraction.confirm_title=지금 탈출할까요?
efpd.extraction.confirm_desc=던전을 떠나 은신처로 돌아갑니다. 은신처에서 전리품을 팔고, 사고, 제작하고, 정리한 뒤 창고에 보관할 수 있습니다.\n\n이번 게임에서는 던전으로 돌아갈 수 없습니다.
efpd.extraction.confirm_yes=탈출
efpd.extraction.success=_탈출 성공!_\n\n최대 도달 층: %1$d\n보관한 아이템: %2$d\n창고의 골드: %3$d\n창고의 연금 에너지: %4$d
efpd.extraction.ascend=위층으로 올라가기
efpd.extraction.boss_exit_open=수호자가 쓰러지자, 위로 올라가는 계단이 던전 밖으로 이어집니다.
efpd.extraction.boss_exit_title=탈출 지점
efpd.extraction.boss_exit_desc=이 층의 수호자가 쓰러졌고, 이 계단은 이제 던전 밖으로 이어집니다.\n\n지금 탈출해서 전리품을 챙기거나, 평소처럼 위층으로 올라갈 수 있습니다.

