efpd.allies.joined=%s이(가) 거점 마을로 옮겨 옵니다!
efpd.allies.desc_ghost=당신이 도와준 슬픈 유령입니다. 마을을 떠돌며 당신을 지켜봅니다.
efpd.allies.desc_wandmaker=늙은 마법사가 마을에 자리를 잡고 연구를 이어 갑니다.
efpd.allies.desc_blacksmith=트롤 대장장이가 마을에 작업장을 차렸습니다.
efpd.allies.desc_imp=임프 상인이 마을에 가판대를 열었습니다.
efpd.allies.perk_ghost=_"당신이 나를 도왔듯, 이제 내가 당신을 지켜 줄게요."_\n\n유령이 마을에 있으면 죽어도 골드를 잃지 않고, 체력이 가득 찬 채로 깨어납니다.
efpd.allies.perk_wandmaker=_"마법봉을 가져오게. 내가 손봐 주지."_\n\n하루에 한 번, 가진 마법봉을 모두 충전해 주고 물약이나 주문서를 하나 줍니다.
efpd.allies.perk_blacksmith=_"건축 자재 필요해? 돌이랑 쇠는 많아."_\n\n하루에 한 번 돌 블록과 정제 금속을 줍니다. 대장장이가 있는 동안 시설·대장간·보급 가방 강화의 골드 비용이 절반입니다.
efpd.allies.perk_imp=_"장사는 장사지, 친구."_\n\n임프가 마을에서 장사하는 동안, 거점에서 아이템을 팔면 50% 더 많은 골드를 받습니다.
efpd.allies.service_wandmaker=마법봉 충전, 선물 받기
