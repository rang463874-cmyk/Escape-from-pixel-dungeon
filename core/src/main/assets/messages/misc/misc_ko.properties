efpd.hvt.hvt.sign_1=마력 파동이 느껴집니다.
efpd.hvt.hvt.sign_2=비명 소리가 들립니다.
efpd.hvt.hvt.alarm=표적 사살! 구역 전체에 경보가 울립니다. 모든 적이 당신을 향해 몰려오고, 성문에는 증원 병력이 배치되었습니다!
efpd.hvt.hvt$manhunt.name=추격당하는 중
efpd.hvt.hvt$manhunt.desc=이 구역의 표적을 처치했습니다. 구역을 떠날 때까지 이곳의 모든 적이 계속 당신의 위치로 몰려옵니다.
efpd.hvt.hvtboss.name=현상수배범
efpd.hvt.hvtboss.name_0=군벌 카엘
efpd.hvt.hvtboss.name_1=저주술사 모로우
efpd.hvt.hvtboss.name_2=도살자 그린트
efpd.hvt.hvtboss.desc_0=약탈단을 거느린 군벌입니다. 엄폐물 뒤에서 사격하고, 움직이는 것에는 수류탄을 던집니다.
efpd.hvt.hvtboss.desc_1=어둠의 마법으로 폐허를 지배하는 배교한 드워프 흑마법사입니다. 암흑 화살을 쏘고 마력 폭발을 일으킵니다.
efpd.hvt.hvtboss.desc_2=길을 막는 자는 누구든 토막 내는 거대한 놀입니다. 근접전으로 돌진하고 화염병을 던지며, 다치면 더 빨라집니다.
efpd.hvt.hvtboss.tactics=전술적으로 싸웁니다. 호위병을 부르고, 사선에서 몸을 숨기고, 짧은 도화선 뒤에 터지는 공격을 던지며(표시된 칸을 피하세요), 크게 다치면 연막 속으로 사라져 상처를 치료합니다.
efpd.hvt.hvtboss.spot_0=적 발견! 쓸어버려!
efpd.hvt.hvtboss.spot_1=침입자라... 반갑군.
efpd.hvt.hvtboss.spot_2=신선한 고기다!
efpd.hvt.hvtboss.throw_0=수류탄!
efpd.hvt.hvtboss.throw_1=마력 폭발!
efpd.hvt.hvtboss.throw_2=화염병!
efpd.hvt.hvtboss.retreat_0=연막! 후퇴한다!
efpd.hvt.hvtboss.retreat_1=오늘은 여기까지다...
efpd.hvt.hvtboss.retreat_2=크르르... 두고 보자!
efpd.hvt.hvtboss.die_0=넌... 여기서 못 나간다...
efpd.hvt.hvtboss.die_1=내 힘이... 온 도시가... 널 쫓을 것이다...
efpd.hvt.hvtboss.die_2=애들아... 놈을... 잡아라...
efpd.hvt.hvtboss.recover=%s이(가) 상처를 치료했습니다!
efpd.hvt.hvtboss.vault_hint=표적이 금고 열쇠를 지니고 있었습니다. 구역의 비밀 금고는 여기서 %s에 있습니다.
efpd.hvt.hvtblast.warn_0=근처에 수류탄이 떨어졌습니다. 표시된 곳에서 벗어나세요!
efpd.hvt.hvtblast.warn_1=바닥에 어둠의 마력이 모입니다. 표시된 곳에서 벗어나세요!
efpd.hvt.hvtblast.warn_2=근처에 화염병이 깨졌습니다. 표시된 곳에서 벗어나세요!
efpd.hvt.hvtblast.killed=마력 폭발에 휘말렸습니다...
efpd.hvt.dogtag.name=%s의 인식표
efpd.hvt.dogtag.desc=%2$d구역의 표적 %1$s을(를) 처치했다는 증거입니다. 팔면 현상금 %3$d골드를 받습니다.
efpd.hvt.vaultkey.name=금고 열쇠
efpd.hvt.vaultkey.desc=%d구역의 표적에게서 얻은 묵직한 열쇠입니다. 그 구역 비밀 금고의 잠긴 문을 엽니다.
efpd.hvt.vaultkey.opened=금고 문이 열렸습니다.
efpd.hvt.hvtgear$commanderscarbine.name=지휘관의 카빈
efpd.hvt.hvtgear$commanderscarbine.desc=군벌이 아끼던 개인 소총입니다. 완벽하게 손질되어 있습니다.
efpd.hvt.hvtgear$commanderscarbine.effect=탄창이 크고 연사가 빠르며, 멀수록 명중률이 오르고, 다른 소총보다 총소리가 작습니다.
efpd.hvt.hvtgear$hexstaff.name=저주의 지팡이
efpd.hvt.hvtgear$hexstaff.desc=배교한 흑마법사의 지팡이입니다. 아직도 어둠의 힘으로 웅웅거립니다.
efpd.hvt.hvtgear$hexstaff.effect=적중하면 대상에게 저주를 걸어 몇 턴 동안 약화시키고 취약하게 만들 수 있습니다.
efpd.hvt.hvtgear$butchercleaver.name=도살자의 식칼
efpd.hvt.hvtgear$butchercleaver.desc=너무 많이 쓰여 이가 빠진 거대한 식칼입니다.
efpd.hvt.hvtgear$butchercleaver.effect=적중하면 깊은 상처를 내어 계속 피를 흘리게 할 수 있습니다.
