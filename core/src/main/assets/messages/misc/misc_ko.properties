efpd.items.essence.recipe=연금술 솥에서 _정수 2개와 씨앗 1개_를 섞으면 _%d등급_ 영구 강화 물약이 됩니다. 씨앗에 따라 물약이 정해집니다: 뱀뿌리 = 근력, 태양초 = 체력, 신속엉겅퀴 = 민첩, 미명초 = 숙련, 눈꽃송이 = 지구력, 마법풀 = 회복력.
