efpd.items.tonic.rules=마시면 해당 영구 스탯의 물약 단계가 1 오릅니다. %d등급 물약은 물약 단계 %d까지만 효과가 있으므로, 높은 단계에는 더 깊은 지역의 정수로 만든 물약이 필요합니다.
