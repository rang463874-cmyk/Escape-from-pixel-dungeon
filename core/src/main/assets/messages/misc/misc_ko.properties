efpd.wndworldmap.city=폐허 도시
efpd.wndworldmap.city_title=폐허 도시
efpd.wndworldmap.city_desc=언덕 너머 전쟁으로 무너진 도시입니다. 건물 안에 희귀한 전리품(높은 등급의 강장제, 정수, 총기, 반지, 마법봉, 아티팩트)이 있습니다. 구역은 같은 순번의 던전 지역이 열리면 함께 열립니다. 성문으로 마을에 돌아갈 수 있고, 떠난 지 3일이 지나면 구역이 새로 바뀝니다.
