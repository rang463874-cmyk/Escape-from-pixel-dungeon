efpd.nausea.name=배탈
efpd.nausea.desc=생수를 마셔서 배탈이 났습니다. 당분간 음식과 물을 넘기지 못합니다.\n\n남은 턴: %s
efpd.nausea.blocked=속이 뒤집혀서 지금은 아무것도 넘길 수 없습니다.

efpd.items.canteen.name=수통
efpd.items.canteen.desc=가죽을 감은 물병입니다. 마을 우물이나 샘에서 채우면 깨끗한 물이고, 던전의 물에서도 채울 수 있습니다. 던전의 물은 생수라서 배탈이 날 수 있으니, 거점의 모닥불 조리대에서 끓여 마시세요.
