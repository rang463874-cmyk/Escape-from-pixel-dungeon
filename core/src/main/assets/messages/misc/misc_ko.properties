efpd.guns.flintlockpistol.name=부싯돌 권총
efpd.guns.flintlockpistol.desc=한 발씩 쏘는 골동품 권총입니다. 재장전은 느리지만 크기에 비해 위력이 셉니다.
efpd.guns.zipgun.name=사제 권총
