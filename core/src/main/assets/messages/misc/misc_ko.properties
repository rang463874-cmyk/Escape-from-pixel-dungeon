efpd.hvt.hvt.brief=_%1$d구역 표적: %2$s_\n\n%3$s %4$s에서 %5$s\n\n표적과 호위병을 처치하고 인식표를 회수하세요. 표적이 쓰러지는 순간 구역 전체에 경보가 울립니다. 모든 적이 몰려오고, 증원 병력이 성문을 지킵니다.
