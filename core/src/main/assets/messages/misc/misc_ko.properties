efpd.openworld.mode_title=모드 선택
efpd.openworld.mode_desc=_익스트랙션:_ 던전에 들어가 전리품을 챙기고 살아서 나옵니다. 게임마다 따로이고, 창고만 이어집니다.\n\n_오픈월드 생존:_ 거점 마을과 여러 지역이 있는 계속되는 세계입니다. 죽으면 장비가 그 자리에 남고, 마을에서 깨어납니다.\n\n_시가전:_ 넓은 폐허 도시입니다. 한가운데서 출발해 건물을 층별로 뒤지고, 성벽의 문으로 탈출합니다. 익스트랙션 규칙을 따릅니다.\n\n_현상금 토벌:_ 시가전 도시의 구역마다 숨은 강력한 표적을 사냥합니다. 대략적인 위치 힌트만 주어지고, 표적을 처치하면 구역 전체가 당신을 쫓습니다.
