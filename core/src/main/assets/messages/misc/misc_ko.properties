efpd.guns.submachinegun.name=기관단총
efpd.guns.submachinegun.desc=무시무시한 속도로 총알을 쏟아 냅니다. 한 발은 약하지만 수가 많습니다.
efpd.guns.assaultrifle.name=돌격소총
efpd.guns.assaultrifle.desc=빠르게 쏘면서도 멀리서 정확한 다재다능한 소총입니다.
efpd.guns.marksmanrifle.name=지정사수 소총
efpd.guns.marksmanrifle.desc=멀리 있는 표적을 저격하기 위한 조준경 달린 소총입니다.
efpd.guns.lightmachinegun.name=경기관총
efpd.guns.lightmachinegun.desc=무거운 벨트 급탄식 기관총입니다. 장탄수도 엄청나고 무게도 엄청납니다.
efpd.guns.antimaterielrifle.name=대물 저격총
efpd.guns.antimaterielrifle.desc=장갑 표적을 위한 괴물 같은 소총입니다. 한 발 한 발이 귀를 찢습니다.
efpd.guns.autoshotgun.name=자동 산탄총
efpd.guns.autoshotgun.desc=드럼 탄창을 순식간에 비워 버리는 산탄총입니다.

