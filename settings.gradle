//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
//pass -PdesktopOnly to skip android/ios (no Android SDK / Google maven needed)
if (!providers.gradleProperty('desktopOnly').isPresent()) {
    include ':android'
    //pass -PskipIos to skip the iOS (RoboVM) module, e.g. on Linux CI
    if (!providers.gradleProperty('skipIos').isPresent()) {
        include ':ios'
    }
}
include ':desktop'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'