# Builds the Android APKs and publishes them as a GitHub Release.
# Triggers:
#  - pushing a change to docs/release-notes.md (the tag is v + appVersionName from build.gradle)
#  - pushing a tag like v0.4.0
#  - running it manually from the Actions tab
name: Android release

on:
  push:
    tags: [ 'v*' ]
    branches: [ '**' ]
    paths: [ 'docs/release-notes.md' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep -oP "appVersionName = '\K[^']+" build.gradle)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Optional private signing key from repository secrets; otherwise the committed debug key is used
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.EFPD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EFPD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EFPD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EFPD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "EFPD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "EFPD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "EFPD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "EFPD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the private key from secrets"
          else
            echo "Signing with the committed debug key"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          # dependency downloads sometimes hit Maven Central rate limits (HTTP 429): retry a few times
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon -PskipIos android:assembleRelease android:assembleDebug > build.log 2>&1; then
              tail -n 20 build.log
              exit 0
            fi
            tail -n 40 build.log
            echo "Build attempt $attempt failed, retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit 1

      - name: Collect APKs
        run: |
          mkdir dist
          cp android/build/outputs/apk/release/*.apk "dist/EscapeFromPixelDungeon-$TAG.apk"
          cp android/build/outputs/apk/debug/*.apk "dist/EscapeFromPixelDungeon-$TAG-devtools.apk"
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Escape from Pixel Dungeon $TAG" --notes-file docs/release-notes.md

      # Without access to the Actions logs, a failed build leaves its log tail in a draft release
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build failed for $TAG"; echo; echo '```'; tail -n 120 build.log 2>/dev/null || echo "no build log"; echo '```'; } > failure.md
          gh release create "build-failed-$TAG-${{ github.run_number }}" --repo "$GITHUB_REPOSITORY" \
            --draft --title "Build failed: $TAG" --notes-file failure.md --target "$GITHUB_SHA"
